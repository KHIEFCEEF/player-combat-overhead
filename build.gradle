plugins {
    id 'java'
}

group = 'com.cosmicforge'
version = '1.2.0'

repositories {
    maven {
        url = 'https://repo.runelite.net'
        content { includeGroupByRegex('net\\.runelite.*') }
    }
    mavenCentral()
}

// Override with -PruneliteVersion=... after a RuneLite update.
def runeLiteVersion = findProperty('runeliteVersion') ?: '1.13.2'

dependencies {
    compileOnly "net.runelite:client:${runeLiteVersion}"
    testImplementation "net.runelite:client:${runeLiteVersion}"
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:4.11.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
}

test {
    systemProperty 'java.awt.headless', 'true'
}

tasks.register('run', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.cosmicforge.combatoverhead.DeveloperLauncher'
    jvmArgs '-ea'
    args '--developer-mode'
}

def launcherDependencies = {
    configurations.testRuntimeClasspath.findAll {
        !(it.name ==~ /(?i)(junit|hamcrest|mockito|byte-buddy|objenesis).*/)
    }
}

// Keep upstream dependency jars intact, including their service-loader entries
// and licence notices. The ordinary jar contains just the plugin classes.
tasks.register('launcherJar', Jar) {
    dependsOn testClasses
    archiveClassifier.set('launcher')
    doFirst {
        manifest.attributes 'Main-Class': 'com.cosmicforge.combatoverhead.DeveloperLauncher',
            'Class-Path': launcherDependencies().collect { 'lib/' + it.name }.join(' ')
    }
    from sourceSets.main.output
    from(sourceSets.test.output) {
        include 'com/cosmicforge/combatoverhead/DeveloperLauncher.class'
    }
}

tasks.register('launcherDistribution', Sync) {
    dependsOn tasks.named('launcherJar')
    into layout.buildDirectory.dir('launcher')
    from(tasks.named('launcherJar')) {
        rename { 'player-combat-overhead-launcher.jar' }
    }
    from(launcherDependencies) { into 'lib' }
}
